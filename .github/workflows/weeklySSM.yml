name: Weekly Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 12PM AEST (2AM UTC)

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run script
        run: node CTA.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
